[project]
name = "breezyvoice-runner"
version = "0.0.0"
description = "PROTOTYPE (throwaway): isolated Py3.10 CPU env for BreezyVoice, called from ../run.py as a subprocess"
requires-python = ">=3.10,<3.11"
# Inference-only subset of vendor/BreezyVoice/requirements.txt. CPU torch from PyPI (not cu118);
# onnxruntime (CPU) instead of onnxruntime-gpu; no deepspeed/ttsfrd/WeTextProcessing/gradio/fastapi/tensorboard.
dependencies = [
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "numpy<2",
    "conformer==0.3.2",
    "diffusers==0.32.0",
    "hydra-core==1.3.2",
    "HyperPyYAML==1.2.2",
    "ruamel.yaml<0.18",  # newer ruamel breaks HyperPyYAML 1.2.2 (Loader has no max_depth)
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "matplotlib",
    "omegaconf==2.3.0",
    "openai-whisper==20250625",  # 20231117 sdist needs pkg_resources at build time; only mel + tokenizer are used
    "onnxruntime",
    "soundfile==0.12.1",
    "rich",
    "gdown",
    "wget",
    "opencc-python-reimplemented",
    "g2pw",
    "transformers>=4.40,<4.47",
    "pyarrow",
    "huggingface_hub",
    "einops",
    "setuptools<70",  # pkg_resources is imported at runtime (lightning 2.2 / matcha import chain)
]

[tool.uv]
package = false
no-build-package = ["tokenizers", "torch", "onnxruntime", "numpy"]
