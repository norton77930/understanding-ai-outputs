<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title">
  <title id="title">上下文視窗如何被填滿</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill: #1f2937; }
    .title { font-size: 24px; font-weight: 700; }
    .name { font-size: 16px; font-weight: 600; }
    .detail { font-size: 13px; fill: #4b5563; }
  </style>
  <rect width="800" height="340" fill="#ffffff"/>
  <text class="title" x="40" y="48">上下文視窗如何被填滿</text>
  <g transform="translate(40, 90)">
    <rect width="720" height="72" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <rect width="160" height="72" rx="8" fill="#1565c0"/>
    <text x="80" text-anchor="middle" fill="#ffffff">
      <tspan class="name" x="80" y="32" fill="#ffffff">系統提示</tspan>
      <tspan x="80" dy="22" font-size="13" fill="#ffffff">每次都送出</tspan>
    </text>
    <rect x="160" width="380" height="72" fill="#fff3cd"/>
    <text class="name" x="350" y="42" text-anchor="middle" style="fill: #4a3800">對話歷史 (chat history)</text>
    <text class="detail" x="700" y="42" text-anchor="end">剩餘空間</text>
  </g>
  <g transform="translate(40 220)">
    <rect width="18" height="18" fill="#1565c0"/>
    <text class="detail" x="28" y="14">固定內容</text>
    <rect x="160" width="18" height="18" fill="#fff3cd" stroke="#b8860b"/>
    <text class="detail" x="188" y="14">會變長的內容</text>
  </g>
  <text class="detail" x="400" y="310" text-anchor="middle">Old turns drop first when the window is full.</text>
</svg>
